# Fly.io config for the Impact Budget app (Spring Boot + bundled React SPA).
# Postgres, Redis, and Redpanda run as separate Fly apps on the private network — see DEPLOY.md.
# Secrets (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET) are set with `fly secrets set`, not here.
app = "impact-budget"
primary_region = "sea"

[build]
  dockerfile = "Dockerfile"

[env]
  # No Ollama in prod: use the neutral scorer + free Open Food Facts / Wikidata enrichment.
  SCORING_PROVIDER = "none"
  OPENFOODFACTS_ENABLED = "true"
  # Seed the demo account so the public link shows a populated dashboard immediately.
  DEMO_SEED_ENABLED = "true"
  # No OTLP collector deployed; disable trace export (metrics/health still on).
  MANAGEMENT_TRACING_ENABLED = "false"
  # Private-network addresses of the sibling apps (see DEPLOY.md).
  KAFKA_BOOTSTRAP_SERVERS = "impact-budget-redpanda.internal:9092"
  REDIS_HOST = "impact-budget-redis.internal"
  REDIS_PORT = "6379"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1        # keep one warm so the demo link responds quickly

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"          # Spring Boot + Flyway migrations need a moment on boot
    method = "GET"
    path = "/actuator/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024                # bump to 2048 if you see OOM in `fly logs`
