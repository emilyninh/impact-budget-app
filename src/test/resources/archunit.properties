# Spring Modulith's boundary verification uses ArchUnit. It only needs to analyze this
# app's own packages, so don't resolve referenced JDK/library classes from the classpath —
# that avoids noisy "Unsupported class file major version" warnings when the build runs on
# a JDK newer than ArchUnit's bundled ASM understands.
resolveMissingDependenciesFromClassPath=false
