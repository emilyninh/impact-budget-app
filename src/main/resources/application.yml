spring:
  application:
    name: impact-budget

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/impactbudget}
    username: ${DB_USER:impactbudget}
    password: ${DB_PASSWORD:impactbudget}

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Serializers/deserializers are configured in KafkaConfig so they use Spring's
    # ObjectMapper (JavaTimeModule) for LocalDate/BigDecimal in event payloads.
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: impact-budget
      auto-offset-reset: earliest
    listener:
      ack-mode: record

# --- Third-party integrations -------------------------------------------------
plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}
  environment: ${PLAID_ENV:sandbox}          # sandbox | production
  # Public base URL Plaid can reach for webhooks (e.g. an ngrok tunnel in dev)
  webhook-url: ${PLAID_WEBHOOK_URL:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

# Which scorer fills the merchant cache on a miss. Default is Ollama (local, free, no key).
categorization:
  scoring:
    provider: ${SCORING_PROVIDER:ollama}      # ollama | claude | none

# Local Ollama server — free, private LLM fallback. Start with: ollama run llama3.1
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.1}

# Open Food Facts eco-score enrichment — free, no API key.
openfoodfacts:
  enabled: ${OPENFOODFACTS_ENABLED:true}
  base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
  min-confidence: 0.6

# Wikidata local-score enrichment (chain / parent-company detection) — free, no API key.
wikidata:
  enabled: ${WIKIDATA_ENABLED:true}
  base-url: ${WIKIDATA_BASE_URL:https://www.wikidata.org}

# App-specific topic names, referenced from producers/consumers
app:
  kafka:
    topics:
      transactions-ingested: transactions.ingested
      transactions-scored: transactions.scored

# --- Resilience (retry/backoff for third-party calls) -------------------------
resilience4j:
  retry:
    instances:
      plaid:
        max-attempts: 4
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - com.impactbudget.ingestion.PlaidException

# --- Observability ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.impactbudget: ${APP_LOG_LEVEL:INFO}
