spring:
  application:
    name: impact-budget

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/impactbudget}
    username: ${DB_USER:impactbudget}
    password: ${DB_PASSWORD:impactbudget}

  jpa:
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Serializers/deserializers are configured in KafkaConfig so they use Spring's
    # ObjectMapper (JavaTimeModule) for LocalDate/BigDecimal in event payloads.
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: impact-budget
      auto-offset-reset: earliest
    listener:
      ack-mode: record

# --- Third-party integrations -------------------------------------------------
plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}
  environment: ${PLAID_ENV:sandbox}          # sandbox | production
  # Public base URL Plaid can reach for webhooks (e.g. an ngrok tunnel in dev)
  webhook-url: ${PLAID_WEBHOOK_URL:}
  # OAuth return URL for banks like Chase/Capital One; must match a Dashboard-registered
  # redirect URI exactly (e.g. http://localhost:5173/ in local dev). Leave blank for sandbox.
  redirect-uri: ${PLAID_REDIRECT_URI:}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

# Which model powers the grounded chat assistant. Default is Ollama (local, free, no API key);
# set to claude for higher-quality tool-calling (requires ANTHROPIC_API_KEY).
assistant:
  provider: ${ASSISTANT_PROVIDER:ollama}      # ollama | claude

# JWT auth. The dev default secret is only for local runs; production must set JWT_SECRET
# (>= 32 chars for HS256).
auth:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-do-not-use-in-prod-please-change-me-0123456789}
    ttl: ${JWT_TTL:12h}

# Which scorer fills the merchant cache on a miss. Default is Ollama (local, free, no key).
categorization:
  scoring:
    provider: ${SCORING_PROVIDER:ollama}      # ollama | claude | none

# Local Ollama server — free, private LLM fallback. Start with: ollama run llama3.1
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.1}

# Open Food Facts eco-score enrichment — free, no API key.
openfoodfacts:
  enabled: ${OPENFOODFACTS_ENABLED:true}
  base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}
  min-confidence: 0.6

# Wikidata local-score enrichment (chain / parent-company detection) — free, no API key.
wikidata:
  enabled: ${WIKIDATA_ENABLED:true}
  base-url: ${WIKIDATA_BASE_URL:https://www.wikidata.org}

# Website-signal enrichment: fetches a small merchant's own site and detects sustainability
# certifications (GOTS, organic, B Corp, …) to lift an otherwise-neutral score. Free, no API key.
web-signal:
  enabled: ${WEB_SIGNAL_ENABLED:true}
  timeout-ms: ${WEB_SIGNAL_TIMEOUT_MS:4000}
  max-pages: ${WEB_SIGNAL_MAX_PAGES:5}

# App-specific topic names, referenced from producers/consumers
app:
  kafka:
    topics:
      transactions-ingested: transactions.ingested
      transactions-scored: transactions.scored

# --- Resilience (retry/backoff for third-party calls) -------------------------
resilience4j:
  retry:
    instances:
      plaid:
        max-attempts: 4
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - com.impactbudget.ingestion.PlaidException

# --- Observability ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  # Distributed tracing across the REST -> outbox -> Kafka -> consumer pipeline, exported via
  # OTLP to Grafana Tempo. Sample everything in dev; lower TRACING_SAMPLE_RATE in production.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Transactional outbox relay: how often to publish committed-but-unsent events to Kafka.
outbox:
  relay:
    interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}

# Dev-only demo data (sample transactions + goals through the real pipeline).
# Off by default and in tests; enabled in docker-compose for local runs.
demo:
  seed-enabled: ${DEMO_SEED_ENABLED:false}

logging:
  level:
    com.impactbudget: ${APP_LOG_LEVEL:INFO}
